let current = 0, score = 0, locked = false;
const progressText = document.getElementById('progressText');
const scoreText = document.getElementById('scoreText');
const progressBar = document.getElementById('progressBar');
const dealTitle = document.getElementById('dealTitle');
const handBox = document.getElementById('handBox');
const contextBox = document.getElementById('contextBox');
const questionBox = document.getElementById('questionBox');
const answersBox = document.getElementById('answersBox');
const feedbackBox = document.getElementById('feedbackBox');
const resultBox = document.getElementById('resultBox');
const nextBtn = document.getElementById('nextBtn');
const restartBtn = document.getElementById('restartBtn');

function renderHand(hand) {
  return `<div class="card"><h3>Main utile</h3>
    <div class="handline">♠ ${hand.S}</div>
    <div class="handline red">♥ ${hand.H}</div>
    <div class="handline red">♦ ${hand.D}</div>
    <div class="handline">♣ ${hand.C}</div>
  </div>`;
}
function loadQuestion() {
  locked = false;
  nextBtn.disabled = true;
  feedbackBox.className = 'feedback';
  feedbackBox.innerHTML = '';
  resultBox.style.display = 'none';
  const d = deals[current];
  progressText.textContent = 'Donne ' + (current + 1) + ' / 50';
  scoreText.textContent = 'Score : ' + score;
  progressBar.style.width = ((current / 50) * 100) + '%';
  dealTitle.textContent = d.title;
  handBox.innerHTML = renderHand(d.hand);
  contextBox.innerHTML = '<b>Contexte :</b> ' + d.context;
  questionBox.textContent = d.question;
  answersBox.innerHTML = '';
  d.answers.forEach((ans, idx) => {
    const btn = document.createElement('button');
    btn.textContent = ans;
    btn.onclick = () => answer(idx);
    answersBox.appendChild(btn);
  });
}
function answer(idx) {
  if (locked) return;
  locked = true;
  const d = deals[current];
  const btns = answersBox.querySelectorAll('button');
  btns[d.correct].classList.add('correct');
  if (idx !== d.correct) btns[idx].classList.add('wrong');
  btns.forEach(b => b.disabled = true);
  const good = d.answers[d.correct];
  if (idx === d.correct) {
    score++;
    feedbackBox.className = 'feedback show good';
    feedbackBox.innerHTML = '<strong>✅ Correct</strong><br>' +
      '<b>Bonne enchère :</b> ' + good + '<br><br>' +
      '<b>Commentaire coach :</b><br>' + d.comment + '<br><br>' +
      '<b>Réflexe de tournoi :</b><br>' + d.coach +
      '<div class="tipbox"><b>Point clé :</b> En tournoi, la première bonne décision consiste à respecter la zone de force et le codage du système avant toute inspiration personnelle.</div>';
  } else {
    feedbackBox.className = 'feedback show bad';
    feedbackBox.innerHTML = '<strong>❌ Faux</strong><br>' +
      '<b>Bonne enchère :</b> ' + good + '<br><br>' +
      '<b>Commentaire coach :</b><br>' + d.comment + '<br><br>' +
      '<b>Erreur classique :</b><br>' + d.mistake + '<br><br>' +
      '<b>Réflexe de tournoi :</b><br>' + d.coach +
      '<div class="tipbox"><b>Point clé :</b> Ta mission n’est pas de trouver une enchère “jolie”, mais l’enchère qui donne l’information la plus fidèle au système.</div>';
  }
  scoreText.textContent = 'Score : ' + score;
  progressBar.style.width = (((current + 1) / 50) * 100) + '%';
  setTimeout(() => { nextBtn.disabled = false; }, 500);
}
function nextQuestion() {
  current++;
  if (current >= 50) {
    showResult();
  } else {
    loadQuestion();
  }
}
function showResult() {
  dealTitle.textContent = 'Tournoi terminé';
  handBox.innerHTML = '';
  contextBox.innerHTML = '';
  questionBox.textContent = 'Résultat final';
  answersBox.innerHTML = '';
  feedbackBox.className = 'feedback';
  feedbackBox.innerHTML = '';
  nextBtn.disabled = true;
  const pct = Math.round((score / 50) * 100);
  let mention = 'À retravailler';
  let conseil = 'Revois les niveaux de force, 1SA / 2SA, les réponses à 2♣ et le système As sur 2♦ forcing manche.';
  if (pct >= 85) {
    mention = 'Excellent niveau expert';
    conseil = 'Tu peux maintenant travailler des séquences plus profondes avec concurrence, choix entre plusieurs lignes et arbitrage IMP / matchpoints.';
  } else if (pct >= 65) {
    mention = 'Bon niveau expert';
    conseil = 'Vise plus de régularité sur les séquences artificielles, les compétitives et les barrages pour convertir les bonnes idées en résultats stables.';
  } else if (pct >= 50) {
    mention = 'Base sérieuse mais fragile';
    conseil = 'Cible un thème par séance : SA, réponses fortes, compétitives, ou chelems. La régularité vient des automatismes.';
  }
  resultBox.style.display = 'block';
  resultBox.innerHTML = '<h2>' + score + ' / 50 — ' + pct + '%</h2><p><b>' + mention + '</b></p><div class="tipbox"><b>Bilan coach final :</b> ' + conseil + '</div><p class="small">Version tournoi expert avec 50 donnes commentées et correction style coach.</p>';
}
nextBtn.onclick = nextQuestion;
restartBtn.onclick = function(){ current = 0; score = 0; loadQuestion(); };
loadQuestion();
</script>
